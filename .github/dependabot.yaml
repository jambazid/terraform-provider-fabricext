---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: main
    labels:
      - "skip-changelog"
    assignees:
      - jambazid
    reviewers:
      - jambazid
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    exclude-paths:
      - ".mise/locks/**"
    groups:
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      gomod:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    labels:
      - "skip-changelog"
    assignees:
      - jambazid
    reviewers:
      - jambazid
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    cooldown:
      default-days: 7
    exclude-paths:
      - ".mise/locks/**"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /modules/permissions
    target-branch: main
    labels:
      - "skip-changelog"
    assignees:
      - jambazid
    reviewers:
      - jambazid
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    exclude-paths:
      - ".mise/locks/**"
    groups:
      terraform:
        patterns:
          - "*"
