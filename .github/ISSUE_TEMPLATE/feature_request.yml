---
name: "🚀 Feature Request"
description: "Suggest a feature, new capability, or enhancement"
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a feature request for `terraform-provider-fabricext`!

  - type: textarea
    id: description
    attributes:
      label: "Proposal"
      description: "A clear and concise description of what feature or enhancement you would like to see."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: "Use Case / Motivation"
      description: "Why is this feature needed? What problem does it solve in your Microsoft Fabric workflow?"
    validations:
      required: true

  - type: textarea
    id: proposed-hcl
    attributes:
      label: "Proposed HCL Syntax (Example)"
      description: "Example Terraform HCL showing how the proposed schema or resource would be configured."
      render: hcl
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative approaches or workarounds currently considered or used."
    validations:
      required: false
