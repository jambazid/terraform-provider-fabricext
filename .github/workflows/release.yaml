---
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: release | prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: runner | harden
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: repo | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: release | check
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            if ! echo "${INPUT_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "ERROR: INPUT_TAG '${INPUT_TAG}' does not match SemVer format (e.g. v0.1.0)" >&2
              exit 1
            fi
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_tag=${INPUT_TAG}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${REF_TYPE}" = "tag" ]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_tag=${REF_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          FILES="$(ls -1v .changes/v*.md 2>/dev/null | tail -n 1 || true)"
          if [ -n "${FILES}" ]; then
            TAG="$(basename "${FILES}" .md)"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "release_tag=" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    name: gate | verify
    needs:
      - prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: runner | harden
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: repo | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: mise | setup
        uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7  # v4.2.4

      - name: check | run
        run: |
          mise run check

  release:
    name: provider | release
    needs:
      - prepare
      - verify
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write  # Upload release assets and changelogs
      id-token: write  # Sign release provenance via GitHub OIDC
      attestations: write  # Attest artifact build provenance
    steps:
      - name: runner | harden
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: repo | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: notes | prepare
        id: notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          NOTES_FILE=".changes/${RELEASE_TAG}.md"
          if [ -f "${NOTES_FILE}" ]; then
            echo "release_notes_arg=--release-notes=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"
          else
            echo "release_notes_arg=" >> "${GITHUB_OUTPUT}"
          fi

      - name: gpg | precheck
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_KEY}" ]; then
            echo "ERROR: GPG_PRIVATE_KEY secret is not configured in the 'release' environment." >&2
            echo "Please configure GPG_PRIVATE_KEY and PASSPHRASE in GitHub Repository Settings -> Environments -> release -> Environment secrets." >&2
            exit 1
          fi

      - name: gpg | import
        id: import_gpg
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: goreleaser | release
        uses: step-security/goreleaser-action@0b0370b85341e59c5eca041619966f53c80fbd41  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2.18.2"
          args: release --clean ${{ steps.notes.outputs.release_notes_arg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: attest | build-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.zip"
