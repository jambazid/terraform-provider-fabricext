# docs: https://changie.dev/config/
---
changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "January 02, 2006"}}'
kindFormat: "### {{.Kind}}"
changeFormat: "* {{.Body}}"
kinds:
  - label: 💥 Breaking
    key: breaking
    auto: minor
  - label: ✨ Added
    key: added
    auto: minor
  - label: 💫 Changed
    key: changed
    auto: minor
  - label: ⚰️ Deprecated
    key: deprecated
    auto: minor
  - label: 🗑️ Removed
    key: removed
    auto: minor
  - label: 🪲 Fixed
    key: fixed
    auto: patch
  - label: 🚨 Security
    key: security
    auto: patch
  - label: 📚 Documentation
    key: documentation
    auto: patch
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
  afterKind: 1
  beforeKind: 1
envPrefix: CHANGIE_
custom:
  - key: Issue
    label: Issue/PR Number
    type: int
    minInt: 1
    optional: true
replacements:
  - path: ./examples/provider/provider.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/azure_cli.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/azure_dev_cli.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/azure_devops_oidc.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/dual_provider.tf
    find: '(?s)(fabricext\s*=\s*\{[^}]*version\s*=\s*")[^"]*(")'
    replace: '${1}~> {{.VersionNoPrefix}}${2}'
  - path: ./examples/provider/managed_identity_system.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/managed_identity_user.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/service_principal_certificate.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/service_principal_oidc.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/service_principal_secret.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/provider/sovereign_cloud.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./examples/modules/permissions/versions.tf
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./README.md
    find: ' version = ".*"'
    replace: ' version = "~> {{.VersionNoPrefix}}"'
  - path: ./modules/permissions/README.md
    find: '(\?ref=)[^"]*'
    replace: '${1}{{.Version}}'
  - path: ./templates/index.md.tmpl
    find: '(\?ref=)[^"]*'
    replace: '${1}{{.Version}}'
  - path: ./templates/guides/official_provider_comparison.md.tmpl
    find: '(?s)(fabricext\s*=\s*\{[^}]*version\s*=\s*")[^"]*(")'
    replace: '${1}~> {{.VersionNoPrefix}}${2}'
