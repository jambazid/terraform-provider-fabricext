---
kind: added
body: >-
  Add full authentication parity with the official Microsoft Fabric provider
  (`registry.terraform.io/microsoft/fabric`), supporting all 8 official authentication
  mechanisms (Static Token, Client Certificate, Client Secret, Azure DevOps OIDC,
  Workload Identity, Managed Identity, Azure Developer CLI, and Azure CLI) alongside
  sovereign cloud environments (`public`, `usgovernment`, `china`), auxiliary tenant
  tokens, and file path credential inputs. Add comprehensive authentication examples,
  Registry documentation guides, automated CI test coverage reporting with Step
  Summaries and PR comments, and Changie pre-commit validation.
