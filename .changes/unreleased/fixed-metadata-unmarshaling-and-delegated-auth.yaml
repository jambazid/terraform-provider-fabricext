kind: fixed
body: >-
  Support numeric userType (0/1) and nullable userId/groupId on Power BI metadata responses,
  add POWERBI_ACCESS_TOKEN environment variable aliases, refine app-only metadata
  diagnostics to AppOnlyMetadataAccessUnsupported, enforce plan-time item identifier validation,
  propagate RequiresReplaceIfConfigured uniformly across Lakehouse roles and security,
  harden HTTP connection pooling during cluster discovery, and update pbimock contract fidelity.
