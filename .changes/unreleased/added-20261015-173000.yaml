kind: added
body: >-
  Add `fabricext_item_access_details` data source and `fabricext_item_share_gate`
  verification waiter resource backed by the Microsoft Fabric Admin API
  (`GET /v1/admin/workspaces/{workspaceId}/items/{itemId}/users`), enabling
  declarative verification of out-of-band item shares for Warehouses,
  SQL Databases, and Lakehouses.
time: 2026-10-15T17:30:00.000000000+01:00
